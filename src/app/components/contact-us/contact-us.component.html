<app-topmenu></app-topmenu>
<header class="wrapper">
  <section
    class="font-pt-sans md:font-bold mt-[100px] text-[16vw] sm:text-[80px]"
  >
    <!-- <h1 class="">Services</h1> -->
  </section>
</header>
<main class="wrapper min-h-[calc(100vh-296px)]">
  <article
    id="contact-form"
    class="border border-gray-400 rounded-[60px] overflow-clip bg-[#F1EDED] mb-[48px]"
  >
    <header
      class="w-full border-b bg-[#007FBB] flex items-center px-4 md:px-16 py-4"
    >
      <button
        class="py-1 pr-6 rounded-full font-pt-sans md:font-bold text-2xl bg-gray-200 flex items-center whitespace-nowrap hover:opacity-60 transition-all ease-in-out duration-200"
      >
        <span class="bg-[#D0E1DF] rounded-full mx-1">
          <svg
            class="h-[40px] w-[40px] fill-[#64ADA5] p-1"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 -960 960 960"
          >
            <path
              d="M320-160q-33 0-56.5-23.5T240-240v-120h120v-90q-35-2-66.5-15.5T236-506v-44h-46L60-680q36-46 89-65t107-19q27 0 52.5 4t51.5 15v-55h480v520q0 50-35 85t-85 35H320Zm120-200h240v80q0 17 11.5 28.5T720-240q17 0 28.5-11.5T760-280v-440H440v24l240 240v56h-56L510-514l-8 8q-14 14-29.5 25T440-464v104ZM224-630h92v86q12 8 25 11t27 3q23 0 41.5-7t36.5-25l8-8-56-56q-29-29-65-43.5T256-684q-20 0-38 3t-36 9l42 42Zm376 350H320v40h286q-3-9-4.5-19t-1.5-21Zm-280 40v-40 40Z"
            />
          </svg>
        </span>
        Contact Us
      </button>
    </header>
    <div class="container">
      <!-- Mensaje de éxito -->
      @if(isSubmitted){
      <div class="success-message w-full text-center p-6">
        <p class="text-lg">
          Thank you! We will get back to you as soon as possible.
        </p>
      </div>
      }

      <!-- Mensaje de error -->
      @if(hasError){
      <div class="error-message w-full text-center p-6">
        <p class="text-lg">
          Sorry, an error has occurred and your message could not be sent.
        </p>
      </div>
      }

      <!-- Formulario -->

      @if(!isSubmitted){
      <form (ngSubmit)="onSubmit()" class="p-6">
        <div class="form__row flex w-full">
          <div
            class="form__group border rounded-full overflow-clip flex items-center text-lg border-gray-400 shadow-md grow w-full md:w-auto"
          >
            <label
              for="name"
              class="h-full md:px-4 p-2 bg-[#a1c4c07c] border-r border-r-gray-400"
              >Name</label
            >
            <input
              class="grow h-full p-2 outline-0"
              id="name"
              name="name"
              [(ngModel)]="name"
              [ngModelOptions]="{ standalone: true }"
              type="text"
              placeholder="Please, enter your name"
            />
          </div>
        </div>
        <div class="form__row flex w-full gap-8 mt-8 flex-wrap">
          <div
            class="form__group border rounded-full overflow-clip flex items-center text-lg border-gray-400 shadow-md grow w-full md:w-auto"
          >
            <label
              for="mail"
              class="h-full px-2 md:px-4 py-2 bg-[#a1c4c07c] border-r border-r-gray-400"
              >Email</label
            >
            <input
              class="grow h-full md:px-4 p-2 outline-0"
              id="mail"
              type="email"
              [(ngModel)]="email"
              [ngModelOptions]="{ standalone: true }"
              placeholder="Please, enter your email"
            />
          </div>
          <div
            class="form__group border rounded-full overflow-clip flex items-center text-lg border-gray-400 shadow-md w-full lg:w-auto"
          >
            <label
              for="jobtitle"
              class="h-full px-2 md:px-4 py-2 bg-[#a1c4c07c] border-r border-r-gray-400 whitespace-nowrap"
              >Job Title</label
            >
            <input
              class="grow h-full p-2 outline-0"
              id="jobtitle"
              type="text"
              [(ngModel)]="jobtitle"
              [ngModelOptions]="{ standalone: true }"
              placeholder="Please, enter your position."
            />
          </div>
        </div>
        <div class="form__row flex w-full mt-8">
          <div
            class="form__group border rounded-full overflow-clip flex items-center text-lg border-gray-400 shadow-md lg:w-[50%] w-full"
          >
            <label
              for="phone"
              class="h-full p-2 md:px-4 bg-[#a1c4c07c] border-r border-r-gray-400"
              >Phone</label
            >
            <input
              class="grow h-full p-2 outline-0"
              id="phone"
              [(ngModel)]="phone"
              [ngModelOptions]="{ standalone: true }"
              type="tel"
              placeholder="Please, enter your phone number"
            />
          </div>
        </div>
        <div class="from__row flex-w-full mt-8 drop-shadow-md">
          <div class="form__group overflow-clip flex flex-col text-lg w-full">
            <div class="flex">
              <label
                for="message-content"
                class="h-full p-2 md:px-4 bg-[#a1c4c07c] rounded-t-[40px] border border-gray-400º w-full md:w-auto"
                >What whould you like to discuss with us ?</label
              >
            </div>
            <textarea
              class="grow h-full p-4 border border-gray-400 rounded-b-[40px] md:rounded-tr-[40px] outline-0"
              id="message-content"
              [(ngModel)]="message"
              [ngModelOptions]="{ standalone: true }"
              rows="4"
              placeholder="Please, enter your message."
            ></textarea>
          </div>
        </div>
        <div class="from__row flex w-full mt-8 justify-end">
          <button
            (click)="onSubmit()"
            class="py-2 px-12 rounded-full bg-[#64ADA5] border border-gray-600 shadow-lg text-white font-medium text-[24px] w-full md:w-auto drop-shadow-md hover:opacity-60 transition-all ease-in-out duration-200"
          >
            Send
          </button>
        </div>
      </form>
      }
    </div>
  </article>
</main>
<footer>
  <app-footer></app-footer>
</footer>
